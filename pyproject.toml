[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failurelab"
version = "0.1.0"
description = "A benchmark that tests whether AI research agents catch planted statistical traps, graded deterministically against known ground truth."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
